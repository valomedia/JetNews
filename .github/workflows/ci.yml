name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  ci:
    uses: valomedia/github-workflows/.github/workflows/android-ci.yml@f443bdf58a1403c669cfdeb33b1d44356a38254d
    with:
      # Empty gradle-version: the runner's preinstalled Gradle only bootstraps the wrapper, and
      # gradle/wrapper/gradle-wrapper.properties decides which Gradle the build itself runs on.
      # The task name must stay qualified; see the same note in cd.yml.
      gradle-version: ''
      gradle-wrapper-command: gradle :wrapper --no-daemon
      build-artifact-name: jetnews-debug-apk
      instrumented-test-command: >-
        bash -c 'set +e;
        adb shell rm -rf /sdcard/Download/jetnews-test-screenshots || true;
        ./gradlew connectedCheck --no-daemon --stacktrace;
        test_status=$?;
        mkdir -p "$GITHUB_WORKSPACE/build/instrumented-test-screenshots";
        adb pull "/sdcard/Download/jetnews-test-screenshots/." "$GITHUB_WORKSPACE/build/instrumented-test-screenshots" || true;
        exit "$test_status"'
      instrumented-test-artifact-name: instrumented-test-screenshots
      instrumented-test-artifact-path: build/instrumented-test-screenshots
