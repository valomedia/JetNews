name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  build:
    name: Build validation
    # Fork PRs are skipped intentionally by repository policy.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.2.1

      - name: Generate Gradle wrapper
        run: gradle wrapper --no-daemon

      - name: Run build validation
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

  unit-tests:
    name: JVM unit and Robolectric tests
    # Fork PRs are skipped intentionally by repository policy.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.2.1

      - name: Generate Gradle wrapper
        run: gradle wrapper --no-daemon

      - name: Run JVM unit and Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

  instrumented-tests:
    name: Instrumented tests
    # Fork PRs are skipped intentionally by repository policy.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.2.1

      - name: Generate Gradle wrapper
        run: gradle wrapper --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            set +e
            ./gradlew connectedCheck --no-daemon --stacktrace
            test_status=$?
            mkdir -p "$GITHUB_WORKSPACE/build/instrumented-test-screenshots"
            adb pull "/sdcard/Android/data/com.example.jetnews/files/test-screenshots/." \
              "$GITHUB_WORKSPACE/build/instrumented-test-screenshots" || true
            exit "$test_status"

      - name: Upload instrumented test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-screenshots
          path: build/instrumented-test-screenshots
          if-no-files-found: warn
