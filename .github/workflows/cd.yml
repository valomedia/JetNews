name: CD

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: jetnews-release
  cancel-in-progress: false

jobs:
  android-release:
    name: Test and publish Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Require main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::CD must be dispatched on main."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types .github/scripts/check-ci.ts

      - name: Install release tooling
        run: npm ci --include=dev

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      # No gradle-version: the runner's preinstalled Gradle only bootstraps the wrapper, and
      # gradle/wrapper/gradle-wrapper.properties decides which Gradle the build itself runs on.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The task name must stay qualified. gradle.properties enables configure-on-demand, so an
      # unqualified `wrapper` makes Gradle configure every project to look for a matching task,
      # which applies AGP and ties the bootstrap Gradle to AGP's supported range.
      - name: Generate Gradle wrapper
        run: gradle :wrapper --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests and collect screenshots
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/instrumented-tests.sh

      - name: Decode signing keystore
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS || vars.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          for variable_name in \
            ANDROID_SIGNING_KEYSTORE_BASE64 \
            ANDROID_SIGNING_KEYSTORE_PASSWORD \
            ANDROID_SIGNING_KEY_ALIAS \
            ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ ! "${!variable_name}" =~ [^[:space:]] ]]; then
              echo "::error::${variable_name} must be configured and nonblank."
              exit 1
            fi
          done

          keystore_path="${RUNNER_TEMP}/android-signing/release.keystore"
          mkdir -p "$(dirname "${keystore_path}")"
          printf '%s' "${ANDROID_SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          echo "ANDROID_SIGNING_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Prepare and publish semantic release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS || vars.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          node --experimental-strip-types .github/scripts/check-ci.ts
          npm run release

      # Retain prepared archives even if GitHub publication fails after the bump commit/tag.
      - name: Upload release archives
        if: ${{ always() && hashFiles('build/release/JetNews-*.zip') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jetnews-release
          path: |
            build/release/JetNews-*.zip
            build/release/JetNews-*.tar.gz
          if-no-files-found: error

      - name: Remove signing keystore
        if: ${{ always() }}
        run: rm -rf "${RUNNER_TEMP}/android-signing"
